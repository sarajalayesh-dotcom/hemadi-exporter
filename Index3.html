<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>حمادی للتصدیر | HEMADI EXPORTER</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --gold:#b8942e;
    --gold2:#d7b957;
    --black:#0a0a0a;
    --gray:#777;
    --line:#e8e3d5;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

    background:#fdfdfc;

    color:var(--black);

    min-height:100vh;
    min-height:100dvh;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow-x:hidden;

    position:relative;
}


/* =========================
   BACKGROUND LIGHT
========================= */

body::before{

    content:"";

    position:fixed;

    width:420px;
    height:420px;

    top:-230px;
    right:-180px;

    border-radius:50%;

    background:
    radial-gradient(
        circle,
        rgba(215,185,87,.18),
        rgba(215,185,87,0)
        70%
    );

    filter:blur(20px);

    pointer-events:none;
}


body::after{

    content:"";

    position:fixed;

    width:380px;
    height:380px;

    bottom:-230px;
    left:-180px;

    border-radius:50%;

    background:
    radial-gradient(
        circle,
        rgba(0,0,0,.07),
        rgba(0,0,0,0)
        70%
    );

    filter:blur(25px);

    pointer-events:none;
}


/* =========================
   PAGE
========================= */

.page{

    width:100%;

    max-width:470px;

    min-height:100vh;
    min-height:100dvh;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:
    clamp(12px,3vw,25px);
}


/* =========================
   MAIN CARD
========================= */

.card{

    width:100%;

    position:relative;

    overflow:hidden;

    border-radius:30px;

    background:
    linear-gradient(
        145deg,
        rgba(255,255,255,.98),
        rgba(249,249,247,.96)
    );

    border:1px solid rgba(184,148,46,.25);

    box-shadow:

        0 30px 80px rgba(0,0,0,.10),

        0 2px 8px rgba(0,0,0,.04),

        inset 0 1px 0 rgba(255,255,255,1);

    padding:
    clamp(23px,6vw,38px)
    clamp(18px,6vw,34px)
    clamp(19px,5vw,28px);

}


/* gold top line */

.card::before{

    content:"";

    position:absolute;

    top:0;
    left:18%;
    right:18%;

    height:2px;

    background:
    linear-gradient(
        90deg,
        transparent,
        var(--gold),
        transparent
    );
}


/* subtle circle */

.card::after{

    content:"";

    position:absolute;

    width:190px;
    height:190px;

    border-radius:50%;

    border:1px solid rgba(184,148,46,.08);

    top:-115px;
    left:-115px;

}


/* =========================
   BRAND AREA
========================= */

.brand{

    text-align:center;

    position:relative;

    z-index:2;

}


/* =========================
   MONOGRAM
========================= */

.monogram{

    width:88px;
    height:88px;

    margin:0 auto 18px;

    border-radius:50%;

    background:
    radial-gradient(
        circle at 35% 25%,
        #333,
        #111 52%,
        #050505 100%
    );

    border:1px solid
    rgba(215,185,87,.85);

    position:relative;

    display:flex;

    align-items:center;
    justify-content:center;

    box-shadow:

        0 15px 35px rgba(0,0,0,.17),

        0 0 45px rgba(184,148,46,.13);
}


.monogram::before{

    content:"";

    position:absolute;

    inset:6px;

    border-radius:50%;

    border:1px solid
    rgba(215,185,87,.45);
}


.monogram::after{

    content:"";

    position:absolute;

    inset:12px;

    border-radius:50%;

    border:1px solid
    rgba(255,255,255,.08);
}


.monogram span{

    position:relative;

    z-index:2;

    color:var(--gold2);

    font-family:Georgia,serif;

    font-size:31px;

    font-weight:bold;

    letter-spacing:-3px;

    direction:ltr;
}


/* =========================
   BRAND NAME
========================= */

.arabic{

    font-size:
    clamp(27px,7vw,35px);

    font-weight:800;

    letter-spacing:-.7px;

    color:#111;

    line-height:1.2;

}


.english{

    margin-top:5px;

    font-family:Georgia,serif;

    font-size:
    clamp(12px,3.5vw,15px);

    font-weight:bold;

    letter-spacing:
    clamp(3px,1vw,5px);

    color:var(--gold);

    direction:ltr;

}


/* =========================
   DIVIDER
========================= */

.divider{

    width:55px;

    height:1px;

    margin:17px auto 15px;

    background:
    linear-gradient(
        90deg,
        transparent,
        var(--gold),
        transparent
    );
}


/* =========================
   TAGLINE
========================= */

.tagline{

    text-align:center;

    color:#666;

    line-height:1.6;

    font-size:
    clamp(11px,3.3vw,14px);

}


.tagline strong{

    display:block;

    color:#222;

    font-size:
    clamp(13px,3.7vw,15px);

    margin-bottom:2px;

}


/* =========================
   PREMIUM BADGE
========================= */

.badge{

    display:flex;

    width:max-content;

    margin:16px auto 20px;

    padding:7px 13px;

    align-items:center;

    gap:7px;

    border-radius:30px;

    background:#111;

    color:#ddd;

    font-size:8px;

    letter-spacing:1.4px;

    direction:ltr;

}


.badge-dot{

    width:5px;
    height:5px;

    border-radius:50%;

    background:var(--gold2);

    box-shadow:
    0 0 8px rgba(215,185,87,.7);

}


/* =========================
   SOCIAL LINKS
========================= */

.links{

    display:flex;

    flex-direction:column;

    gap:9px;

}


/* =========================
   BUTTON
========================= */

.link{

    min-height:54px;

    width:100%;

    display:flex;

    align-items:center;

    text-decoration:none;

    border-radius:15px;

    background:#fff;

    border:1px solid #e9e9e7;

    box-shadow:
    0 5px 18px rgba(0,0,0,.045);

    transition:
    .25s ease;

    position:relative;

    overflow:hidden;
}


.link:hover{

    border-color:
    rgba(184,148,46,.45);

    box-shadow:
    0 10px 28px rgba(0,0,0,.08);

    transform:translateY(-1px);
}


/* gold side */

.link::before{

    content:"";

    position:absolute;

    right:0;
    top:0;
    bottom:0;

    width:2px;

    background:
    linear-gradient(
        transparent,
        var(--gold),
        transparent
    );

}


/* =========================
   ICON
========================= */

.icon{

    width:36px;
    height:36px;

    margin-right:9px;

    border-radius:10px;

    background:#101010;

    color:var(--gold2);

    display:flex;

    align-items:center;
    justify-content:center;

    font-family:Arial,sans-serif;

    font-size:13px;

    font-weight:bold;

    direction:ltr;

    flex-shrink:0;

}


/* =========================
   TEXT
========================= */

.text{

    flex:1;

    text-align:right;

    padding-right:12px;

}


.text-ar{

    display:block;

    color:#151515;

    font-size:
    clamp(12px,3.5vw,14px);

    font-weight:700;

}


.text-en{

    display:block;

    margin-top:3px;

    color:#999;

    font-size:8px;

    letter-spacing:1.3px;

    direction:ltr;

}


/* =========================
   STATUS DOT
========================= */

.status{

    width:7px;
    height:7px;

    border-radius:50%;

    margin-left:15px;

    border:1px solid var(--gold);

    background:#fff;

}


/* =========================
   COMPANY INFO
========================= */

.company-info{

    margin-top:18px;

    padding:13px 8px;

    border-top:1px solid #eee;

    border-bottom:1px solid #eee;

    display:flex;

    justify-content:center;

    align-items:center;

    gap:15px;

    flex-wrap:wrap;

    direction:ltr;

}


.company-info span{

    font-size:8px;

    letter-spacing:1px;

    color:#777;

}


.company-info b{

    color:var(--gold);

    font-weight:500;

}


/* =========================
   FOOTER
========================= */

.footer{

    text-align:center;

    margin-top:13px;

    color:#aaa;

    font-size:7px;

    letter-spacing:1.5px;

    direction:ltr;

}


.footer strong{

    color:#555;

}


/* =========================
   SMALL PHONES
========================= */

@media(max-height:680px){

    .page{

        padding:9px 13px;

    }

    .card{

        padding:
        18px 16px 13px;

        border-radius:25px;

    }

    .monogram{

        width:65px;
        height:65px;

        margin-bottom:9px;

    }

    .monogram span{

        font-size:24px;

    }

    .arabic{

        font-size:24px;

    }

    .english{

        margin-top:3px;

    }

    .divider{

        margin:10px auto;

    }

    .tagline{

        line-height:1.4;

    }

    .badge{

        margin:10px auto 12px;

    }

    .links{

        gap:6px;

    }

    .link{

        min-height:43px;

        border-radius:12px;

    }

    .icon{

        width:29px;
        height:29px;

    }

    .company-info{

        margin-top:10px;

        padding:8px 5px;

    }

    .footer{

        margin-top:7px;

    }

}


/* =========================
   LARGER SCREENS
========================= */

@media(min-width:700px){

    .page{

        max-width:510px;

    }

}

</style>

</head>
